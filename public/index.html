<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual of Me · PossAbilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>

/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --purple:    #48065A;
  --pink:      #EC008C;
  --teal:      #66CCCC;
  --teal-dark: #3BA8A8;
  --white:     #FFFFFF;
  --pale-teal: #EFF9F9;
  --pale-pink: #FFF0F7;
  --ink:       #1A1025;
  --rule:      #DDD4E8;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  font-family: 'Nunito', 'Avenir', 'Helvetica Neue', Arial, sans-serif;
  background: #2D1040;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 0 60px;
}

/* ─── OUTER GALLERY FRAME ────────────────────────────── */
/* ─── PAGE ───────────────────────────────────────────── */
.page {
  width:  8.5in;
  height: 11in;
  background: var(--white);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ─── HERO ───────────────────────────────────────────── */
/* Photo lives inside the purple zone as the left column.
   Title text is to its right — zero chance of overlap.    */
.hero {
  background: var(--purple);
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 142px 1fr;
  padding: 20px 32px 0 28px;
  align-items: end;
  gap: 0;
}

/* ── Photo inside hero ── */
.hero-photo {
  padding-bottom: 0;
  position: relative;
  z-index: 2;
}

.photo-frame {
  width: 108px;
  height: 132px;
  border: 4px solid var(--teal);
  box-shadow: 5px 5px 0 var(--pink);
  background: rgba(102,204,204,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--teal);
  text-align: center;
  gap: 5px;
  transition: border-color 0.2s;
}

.photo-frame:hover { border-color: var(--pink); }
.photo-frame input,
#photoInput { display: none !important; }

.photo-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-icon { font-size: 24px; opacity: 0.5; }
.photo-hint { opacity: 0.7; line-height: 1.4; font-size: 10px; }

/* ── Title + brand (right column of hero) ── */
.hero-text {
  padding: 0 0 12px 22px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
  text-align: right;
}

.hero-logomark {
  font-size: 15px;
  font-weight: 900;
  color: var(--white);
  text-align: right;
  letter-spacing: 0.3px;
  padding-right: 2px;
  margin-bottom: 1px;
}

.hero-logomark span { color: var(--pink); }

.hero-title {
  font-size: 44px;
  font-weight: 900;
  font-style: italic;
  color: var(--teal);
  line-height: 1;
  letter-spacing: -1.5px;
}

.hero-title em {
  color: var(--white);
  font-weight: 300;
  font-style: normal;
}

.hero-brand {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.3px;
  font-style: italic;
}

.hero-brand strong {
  color: rgba(255,255,255,0.75);
  font-style: normal;
  font-weight: 900;
}

.hero-brand strong span { color: var(--pink); }

/* ─── TEAL WAVE ──────────────────────────────────────── */
.wave-wrap {
  width: 100%;
  flex-shrink: 0;
  display: block;
  line-height: 0;
  background: var(--purple);
}

.wave-wrap svg { display: block; width: 100%; }

/* ─── IDENTITY (name + meta — now fully on white) ─────── */
/* No negative margin, no z-index tricks, no invisible text */
.identity {
  background: var(--white);
  flex-shrink: 0;
  padding: 14px 32px 14px 32px;
  border-bottom: 1.5px solid var(--rule);
  margin-bottom: 12px;
}

.name-wrap {
  border-bottom: 3px solid var(--pink);
  margin-bottom: 11px;
}

/* The name input: typed text is bold, large, purple on white.
   Unmistakably visible the moment you start typing.           */
.name-wrap input {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 36px;
  font-weight: 900;
  color: var(--purple);        /* ← dark purple on white — always visible */
  background: var(--white);    /* ← explicit white, never transparent over wave */
  border: none;
  padding: 0 0 5px 0;
  letter-spacing: -0.5px;
  line-height: 1;
}

.name-wrap input::placeholder {
  color: #C8C0D4;              /* ← light purple placeholder */
  font-weight: 700;
}

.name-wrap input:focus { outline: none; }

.meta-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.meta-label {
  font-size: 8.5px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--teal-dark);
}

.meta-item input {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  background: var(--white);    /* ← explicit, never transparent */
  border: none;
  border-bottom: 1.5px solid var(--rule);
  padding: 2px 0;
  width: 100%;
}

.meta-item input::placeholder { color: #CCC; font-weight: 400; }
.meta-item input:focus { outline: none; border-bottom-color: var(--teal); }

/* ─── BODY ───────────────────────────────────────────── */
.body-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 32px 14px;
  gap: 10px;
  min-height: 0;
}

/* ─── TWO-COL ────────────────────────────────────────── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1.65fr;
  gap: 10px;
  flex: 1.4;
  min-height: 0;
}

/* ─── SECTION CARD ───────────────────────────────────── */
.card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.card-hd {
  flex-shrink: 0;
  padding: 7px 14px 6px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1.8px;
}

.hd-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.card-bd {
  flex: 1;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
}

.card-bd textarea {
  flex: 1;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.55;
  color: inherit;
  background: transparent;
  border: none;
  resize: none;
  width: 100%;
  padding: 0;
}

.card-bd textarea::placeholder { font-weight: 400; }
.card-bd textarea:focus { outline: none; }

.card-bd .print-text {
  display: none;
  position: relative;
  z-index: 1;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.55;
  color: inherit;
}
.card-bd .print-text p { margin: 0 0 0.9em; }
.card-bd .print-text p:last-child { margin-bottom: 0; }

/* ADMIRE — dark purple, white text */
.card-admire               { background: var(--purple); border: 2px solid var(--purple); }
.card-admire .card-hd      { background: rgba(0,0,0,0.22); color: var(--teal); }
.card-admire .hd-dot       { background: var(--teal); }
.card-admire .card-bd      { color: rgba(255,255,255,0.92); }
.card-admire textarea::placeholder { color: rgba(255,255,255,0.28); }

/* IMPORTANT — teal header */
.card-important              { background: var(--pale-teal); border: 2px solid var(--teal); }
.card-important .card-hd     { background: var(--teal); color: var(--purple); }
.card-important .hd-dot      { background: var(--purple); }
.card-important .card-bd     { color: var(--ink); }
.card-important textarea::placeholder { color: #A8C8C8; }

/* SUPPORT — pink header, full width */
.card-support              { background: var(--pale-pink); border: 2px solid var(--pink); flex: 1; min-height: 0; }
.card-support .card-hd     { background: var(--pink); color: var(--white); }
.card-support .hd-dot      { background: rgba(255,255,255,0.6); }
.card-support .card-bd     { color: var(--ink); }
.card-support textarea::placeholder { color: #D8A8C0; }

/* SUPERPOWER — dark purple, special */
.card-super                { background: var(--purple); border: 2px solid var(--purple); height: 148px; flex-shrink: 0; position: relative; overflow: hidden; }
.card-super .card-hd       { background: transparent; color: var(--pink); border-bottom: 1px solid rgba(236,0,140,0.2); position: relative; z-index: 1; }
.card-super .hd-dot        { background: var(--pink); }
.card-super .card-bd       { color: rgba(255,255,255,0.9); position: relative; z-index: 1; }
.card-super textarea::placeholder { color: rgba(255,255,255,0.28); }

.card-super::before {
  content: '';
  position: absolute;
  right: -55px; top: -55px;
  width: 220px; height: 220px;
  border-radius: 50%;
  border: 28px solid rgba(102,204,204,0.1);
  pointer-events: none;
}

.card-super::after {
  content: '';
  position: absolute;
  right: 20px; bottom: -65px;
  width: 170px; height: 170px;
  border-radius: 50%;
  border: 22px solid rgba(236,0,140,0.09);
  pointer-events: none;
}

/* ─── FOOTER ─────────────────────────────────────────── */
.footer {
  flex-shrink: 0;
  background: var(--purple);
  padding: 9px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  white-space: nowrap;
  overflow: hidden;
  gap: 8px;
}

.footer-logo {
  font-size: 12px;
  font-weight: 900;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.footer-logo span { color: var(--pink); }

.footer-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.footer-divider {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
}

.footer-dept {
  font-size: 9px;
  font-weight: 600;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  letter-spacing: 1px;
  white-space: nowrap;
}

.footer-tagline {
  font-size: 10px;
  font-weight: 700;
  font-style: italic;
  color: var(--teal);
  white-space: nowrap;
}

/* ─── CONTROLS ───────────────────────────────────────── */
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding: 20px;
  width: 100%;
}

.btn {
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 11px 18px;
  border: none;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
}

.btn:hover  { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 rgba(0,0,0,0.35); }
.btn:active { transform: translate(1px,1px);   box-shadow: 1px 1px 0 rgba(0,0,0,0.2); }

.btn-save  { background: var(--pink);  color: #fff; }
.btn-print { background: var(--teal);  color: var(--purple); }
.btn-clear { background: #ddd;         color: var(--purple); }
.btn-link  { background: var(--purple); color: #fff; }

/* ─── TOAST ──────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--purple);
  color: #fff;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── PERSONAL LINK BANNER ───────────────────────────── */
.personal-link-banner {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  width: 100%;
  max-width: 8.5in;
  padding: 10px 20px;
  background: var(--pale-teal);
  border-bottom: 2px solid var(--teal);
  color: var(--purple);
  font-size: 12.5px;
  font-weight: 700;
  text-align: center;
}
.personal-link-banner.show { display: flex; }
.personal-link-banner .banner-link {
  color: var(--purple);
  font-weight: 900;
  text-decoration: underline;
  text-decoration-color: var(--pink);
  text-underline-offset: 2px;
  white-space: nowrap;
}
.personal-link-banner .banner-link:hover { color: var(--pink); }
.personal-link-banner .banner-dismiss {
  background: none;
  border: none;
  font-size: 16px;
  font-weight: 900;
  color: var(--purple);
  opacity: 0.5;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
}
.personal-link-banner .banner-dismiss:hover { opacity: 1; }

@media print {
  .personal-link-banner { display: none !important; }
}

/* ─── PRINT ──────────────────────────────────────────── */
@media print {
  html, body { background: white; padding: 0; }
  .controls { display: none; }
  .toast { display: none; }
  @page { size: 8.5in 22in; margin: 0; }
}

/* ─── PRINT LAYOUT (JS-driven, see prepareForPrint) ─────
   A <textarea> can't be split across a page break in any browser — long
   text just overflows or gets shoved whole onto the next page. So before
   printing we swap each textarea for a plain flowing block and switch
   every ancestor from flex/grid to normal block flow. That alone isn't
   enough, though: Chromium's own print-pagination pass has a bug where it
   miscalculates a growing colored box's height whenever the export needs
   more than one page — either bleeding text across box boundaries or
   silently clipping it, with no CSS combination avoiding both at once. So
   the @page rule above is deliberately much taller than a normal one-pager
   ever needs, so everything fits on a single page and that pagination bug
   never triggers. (A JS-computed exact-fit page height looks tempting, but
   printers/PDF exporters read @page dimensions before any 'beforeprint'
   handler can change them, so a size set at print time is ignored — this
   has to be a plain static value.) This is a plain class rather than
   @media print because the browser only switches to print-media layout
   *after* 'beforeprint' handlers finish, so a class we toggle ourselves is
   what lets prepareForPrint build the print-text mirrors in time. */
html.printing-mode .page { width: 100%; height: auto; box-shadow: none; margin: 0; display: block; }
html.printing-mode .body-wrap { display: block; }
html.printing-mode .two-col { display: block; }
html.printing-mode .card,
html.printing-mode .card-bd,
html.printing-mode .card-support { height: auto; min-height: 0; flex: none; overflow: visible; display: block; }
html.printing-mode .card-bd textarea { display: none; }
html.printing-mode .card-bd .print-text { display: block; }

/* ─── RESPONSIVE ─────────────────────────────────────── */
@media (max-width: 820px) {
  body { padding: 0; }
  .page { width: 100%; height: auto; box-shadow: none; }
  .hero { grid-template-columns: 110px 1fr; padding: 16px 16px 0 16px; }
  .hero-text { padding: 0 0 12px 14px; text-align: right; }
  .hero-title { font-size: 30px; }
  .hero-logomark { text-align: right; }
  .photo-frame { width: 90px; height: 110px; }
  .name-wrap input { font-size: 28px; }
  .meta-row { grid-template-columns: 1fr 1fr; }
  .two-col { grid-template-columns: 1fr; flex: none; }
  .two-col .card { height: 200px; }
  .card-support { flex: none; min-height: 200px; }
  .footer { padding: 9px 14px; gap: 6px; }
  .footer-logo { font-size: 10px; }
  .footer-dept { font-size: 8px; letter-spacing: 0.5px; }
  .footer-tagline { font-size: 9px; }
  .controls { position: static; justify-content: center; padding: 20px; background: #2D1040; flex-wrap: wrap; width: 100%; }
}

</style>
</head>
<body>

<div class="page">

  <div class="personal-link-banner" id="personalLinkBanner">
    <span id="personalLinkBannerText"></span>
    <a class="banner-link" id="personalLinkStartNew" href="">🆕 Start a new one</a>
    <button class="banner-dismiss" id="personalLinkDismiss" aria-label="Dismiss">×</button>
  </div>

  <!-- ── HERO: photo on left, title on right, no overlap ── -->
  <div class="hero">

    <div class="hero-photo">
      <div class="photo-frame" id="photoFrame" onclick="document.getElementById('photoInput').click()">
        <img id="photoImg" style="display:none">
        <div class="photo-icon" id="photoIcon">◻</div>
        <div class="photo-hint" id="photoHint">Tap to<br>add photo</div>
      </div>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="hero-text">
      <div class="hero-logomark">Poss<span>Abilities</span></div>
      <div class="hero-title">Manual <em>of</em> Me</div>
    </div>

  </div>

  <!-- ── TEAL WAVE — brand motif ── -->
  <div class="wave-wrap">
    <svg viewBox="0 0 816 46" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,0 L816,0 L816,12 C680,44 560,50 420,30 C280,10 150,44 0,36 Z" fill="#48065A"/>
      <path d="M0,38 C130,18 270,48 420,32 C570,16 690,46 816,18 L816,46 L0,46 Z" fill="#66CCCC"/>
    </svg>
  </div>

  <!-- ── IDENTITY: name + meta on clean white — always readable ── -->
  <div class="identity">
    <div class="name-wrap">
      <input type="text" id="name" placeholder="Your name" autocomplete="off">
    </div>
    <div class="meta-row">
      <div class="meta-item">
        <span class="meta-label">Job title</span>
        <input type="text" id="jobTitle" placeholder="e.g. Support Worker" autocomplete="off">
      </div>
      <div class="meta-item">
        <span class="meta-label">Team</span>
        <input type="text" id="team" placeholder="e.g. West Team" autocomplete="off">
      </div>
      <div class="meta-item">
        <span class="meta-label">Since</span>
        <input type="text" id="since" placeholder="e.g. Jan 2024" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- ── MAIN SECTIONS ── -->
  <div class="body-wrap">

    <div class="two-col">
      <div class="card card-admire">
        <div class="card-hd"><div class="hd-dot"></div>My Super Powers</div>
        <div class="card-bd" style="position:relative;">

      <div class="card card-important">
        <div class="card-hd"><div class="hd-dot"></div>What is important to me</div>

          <textarea id="important" placeholder="Your values, priorities and what matters most — family, relationships, interests, how you like to work, what brings you joy…"></textarea>

      <span class="footer-tagline">Live The Life You Choose</span>

</div><!-- .page -->

<!-- Controls -->
<div class="controls">
  <button class="btn btn-link"  onclick="copyLink()">🔗 My Link</button>
  <button class="btn btn-save"  onclick="savePDF()">💾 Save as PDF</button>
  <button class="btn btn-print" onclick="window.print()">🖨 Print</button>
  <button class="btn btn-clear" onclick="clearAll()">↺ Clear</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const WORKER_URL = 'https://manual-of-me-api.digital-a7e.workers.dev';
  const FIELDS = ['name','jobTitle','team','since','admire','important','support','superpower'];

  const params = new URLSearchParams(location.search);
  let id = params.get('id');
  if (!id || id.length < 8) {
    id = crypto.randomUUID();
    params.set('id', id);
    history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
  }

  let saveTimer = null;
  let toastTimer = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  function currentData() {
    const data = {};
    FIELDS.forEach(f => {
      const el = document.getElementById(f);
      if (el) data[f] = el.value;
    });
    const img = document.getElementById('photoImg');
    data.photo = img.style.display !== 'none' ? img.src : '';
    return data;
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 600);
  }

  async function save() {
    try {
      const res = await fetch(`${WORKER_URL}?id=${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentData()),
      });
      if (!res.ok) throw new Error('save failed');
      showToast('✓ Saved');
    } catch (err) {
      showToast('⚠ Save failed — check connection');
    }
  }

  async function load() {
    try {
      const res = await fetch(`${WORKER_URL}?id=${id}`);
      const data = await res.json();
      FIELDS.forEach(f => {
        const el = document.getElementById(f);
        if (el && data[f]) el.value = data[f];
      });
      if (data.photo) {
        document.getElementById('photoImg').src          = data.photo;
        document.getElementById('photoImg').style.display = 'block';
        document.getElementById('photoIcon').style.display = 'none';
        document.getElementById('photoHint').style.display = 'none';
      }
      const hasContent = data.photo || FIELDS.some(f => data[f]);
      if (hasContent) maybeShowPersonalLinkBanner(data);
    } catch (err) {
      showToast('⚠ Could not load saved data');
    }
  }

  function maybeShowPersonalLinkBanner(data) {
    const dismissKey = `dismissedBanner_${id}`;
    try {
      if (localStorage.getItem(dismissKey)) return;
    } catch (err) { /* localStorage unavailable — just show the banner */ }

    const banner = document.getElementById('personalLinkBanner');
    const textEl = document.getElementById('personalLinkBannerText');
    const startNewLink = document.getElementById('personalLinkStartNew');
    const dismissBtn = document.getElementById('personalLinkDismiss');

    textEl.textContent = data.name
      ? `📋 You're viewing "${data.name}"'s personal Manual of Me link.`
      : `📋 This is someone's personal Manual of Me link.`;
    startNewLink.href = location.origin + location.pathname;
    dismissBtn.onclick = () => {
      try { localStorage.setItem(dismissKey, '1'); } catch (err) { /* ignore */ }
      banner.classList.remove('show');
    };
    banner.classList.add('show');
  }

  function copyLink() {
    navigator.clipboard.writeText(location.href)
      .then(() => showToast('🔗 Link copied!'))
      .catch(() => showToast('⚠ Could not copy link'));
  }

  document.getElementById('photoInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('photoImg');
      img.src = ev.target.result;
      img.style.display = 'block';
      document.getElementById('photoIcon').style.display = 'none';
      document.getElementById('photoHint').style.display = 'none';
      scheduleSave();
    };
    reader.readAsDataURL(file);
  });

  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if (el) el.addEventListener('input', scheduleSave);
  });

  window.addEventListener('load', load);

  function buildPrintText(el) {
    let mirror = el.nextElementSibling;
    if (!mirror || !mirror.classList.contains('print-text')) {
      mirror = document.createElement('div');
      mirror.className = 'print-text';
      el.insertAdjacentElement('afterend', mirror);
    }
    mirror.replaceChildren();
    el.value.split(/\n{2,}/).forEach(paragraph => {
      const p = document.createElement('p');
      p.textContent = paragraph;
      mirror.appendChild(p);
    });
  }

  function refreshPrintText() {
    document.querySelectorAll('.card-bd textarea').forEach(buildPrintText);
  }

  function prepareForPrint() {
    refreshPrintText();
    document.documentElement.classList.add('printing-mode');
  }

  function cleanupAfterPrint() {
    document.documentElement.classList.remove('printing-mode');
  }

  window.addEventListener('beforeprint', prepareForPrint);
  window.addEventListener('afterprint', cleanupAfterPrint);

  function savePDF() {
    alert('In the print dialog, set the destination to "Save as PDF" then click Save.');
    window.print();
  }

  function clearAll() {
    if (!confirm('Clear everything and start fresh?')) return;
    FIELDS.forEach(f => {
      const el = document.getElementById(f);
      if (el) el.value = '';
    });
    document.getElementById('photoImg').style.display   = 'none';
    document.getElementById('photoIcon').style.display  = 'block';
    document.getElementById('photoHint').style.display  = 'block';
    document.getElementById('photoInput').value = '';
    save();
  }
</script>
</body>
</html>
